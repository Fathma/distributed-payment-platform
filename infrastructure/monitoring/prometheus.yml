global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: payflow-services
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:3000', 'order-service:3001', 'payment-service:3002', 'payment-worker:3003']
