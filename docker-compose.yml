name: payflow

services:
  postgres:
    build:
      context: .
      dockerfile: infrastructure/postgres/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-data-init:
    image: busybox:1.36
    user: '0:0'
    command: ['sh', '-c', 'chown -R 1000:1000 /data']
    volumes:
      - kafka-data:/data
    restart: 'no'

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic order.created --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic payment.requested --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic payment.completed --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic payment.failed --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic payment.succeeded --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic payment.declined --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic payment.dlq --partitions 6 --replication-factor 1
    restart: 'no'

  migrate-databases:
    image: payflow-postgres
    build:
      context: .
      dockerfile: infrastructure/postgres/Dockerfile
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        PGPASSWORD=order_dev_password psql -h postgres -U order_app -d order_db -v ON_ERROR_STOP=1 -f /migrations/order/001_initial.sql &&
        PGPASSWORD=payment_dev_password psql -h postgres -U payment_app -d payment_db -v ON_ERROR_STOP=1 -f /migrations/payment/001_initial.sql &&
        PGPASSWORD=worker_dev_password psql -h postgres -U worker_app -d worker_db -v ON_ERROR_STOP=1 -f /migrations/worker/001_initial.sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  prometheus:
    build:
      context: .
      dockerfile: infrastructure/monitoring/Dockerfile
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - prometheus-data:/prometheus
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus']

  grafana:
    build:
      context: .
      dockerfile: infrastructure/monitoring/grafana/Dockerfile
    ports:
      - '${GRAFANA_PORT:-3004}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        SERVICE: api-gateway
    ports:
      - '${API_GATEWAY_PORT:-3000}:3000'
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      ORDER_SERVICE_URL: http://order-service:3001
      PAYMENT_SERVICE_URL: http://payment-service:3002
      WORKER_SERVICE_URL: http://payment-worker:3003
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-jwt-secret-before-deploying}
      DEV_CUSTOMER_ID: ${DEV_CUSTOMER_ID:-usr_customer}
      DEV_CUSTOMER_EMAIL: ${DEV_CUSTOMER_EMAIL:-customer@example.test}
      DEV_CUSTOMER_PASSWORD: ${DEV_CUSTOMER_PASSWORD:-customer-dev-password}
      DEV_ADMIN_ID: ${DEV_ADMIN_ID:-usr_admin}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@example.test}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-admin-dev-password}
      DLQ_ADMIN_TOKEN: ${DLQ_ADMIN_TOKEN:-local-dlq-admin-token}
    depends_on:
      redis:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      payment-worker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  order-service:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        SERVICE: order-service
    environment:
      PORT: 3001
      ORDER_DATABASE_URL: postgresql://order_app:order_dev_password@postgres:5432/order_db
      KAFKA_BROKERS: kafka:19092
    depends_on:
      migrate-databases:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  payment-service:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        SERVICE: payment-service
    environment:
      PORT: 3002
      PAYMENT_DATABASE_URL: postgresql://payment_app:payment_dev_password@postgres:5432/payment_db
      KAFKA_BROKERS: kafka:19092
    depends_on:
      migrate-databases:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3002/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  payment-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        SERVICE: payment-worker
    environment:
      PORT: 3003
      KAFKA_BROKERS: kafka:19092
      WORKER_DATABASE_URL: postgresql://worker_app:worker_dev_password@postgres:5432/worker_db
      DLQ_ADMIN_TOKEN: ${DLQ_ADMIN_TOKEN:-local-dlq-admin-token}
      PAYMENT_MAX_ATTEMPTS: ${PAYMENT_MAX_ATTEMPTS:-4}
      PAYMENT_RETRY_BASE_MS: ${PAYMENT_RETRY_BASE_MS:-1000}
      PAYMENT_RETRY_MAX_MS: ${PAYMENT_RETRY_MAX_MS:-30000}
      MOCK_PROVIDER_MODE: ${MOCK_PROVIDER_MODE:-success}
      MOCK_PROVIDER_SUCCESS_RATE: ${MOCK_PROVIDER_SUCCESS_RATE:-0.9}
      MOCK_PROVIDER_TIMEOUT_MS: ${MOCK_PROVIDER_TIMEOUT_MS:-1500}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate-databases:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3003/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
